[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "colorcorrect-studio"
version = "2.2.1"
description = "Dependency-free Python workflows for the native ColorCorrect Studio engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ColorCorrect Studio contributors"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Graphics",
]

[project.scripts]
colorcorrect = "colorcorrect:main"

[tool.setuptools]
py-modules = ["colorcorrect", "colorcorrect_sdk", "colorcorrect_pipeline"]
