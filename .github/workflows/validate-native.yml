name: Native PR validation (no publishing)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CI: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.402
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Source, public corpus and pinned toolchains
        shell: pwsh
        run: |
          python scripts/check_repository.py
          if ($LASTEXITCODE -ne 0) { throw 'source gate' }
          ./scripts/link_samples.ps1
          rustup set auto-self-update disable
          rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust setup' }
      - name: Full build SDK and immutable media tools
        shell: pwsh
        run: |
          ./scripts/fetch_libtorch.ps1 -Kind cpu -StageOnly
          ./scripts/fetch_ffmpeg.ps1
      - name: Rust gates
        shell: pwsh
        run: |
          $env:LIBTORCH = (Get-Content .build-cache/sdk-cpu.json -Raw | ConvertFrom-Json).path
          $env:LIBTORCH_PATH = $env:LIBTORCH
          $env:LIBTORCH_BYPASS_VERSION_CHECK = '1'
          $env:PATH = "$env:LIBTORCH/lib;$env:PATH"
          $env:CCP_FFMPEG = (Resolve-Path installer/ffmpeg.exe).Path
          $env:CCP_FFPROBE = (Resolve-Path installer/ffprobe.exe).Path
          cargo fmt --manifest-path engine/Cargo.toml --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust format' }
          cargo clippy --manifest-path engine/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Rust lint' }
          cargo test --manifest-path engine/Cargo.toml --workspace --all-targets --all-features --locked
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests' }
      - name: .NET 10 and Python regression gates
        shell: pwsh
        run: |
          dotnet restore app/ColorCorrect.sln --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'locked restore' }
          dotnet test app/ColorCorrect.sln -c Release --no-restore --logger trx
          if ($LASTEXITCODE -ne 0) { throw '.NET tests' }
          python -m unittest discover -s api/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Python tests' }
      - name: Packaged CPU sample workflows and fresh notebook kernels
        shell: pwsh
        run: |
          ./scripts/package_windows.ps1 -SkipFetch -SkipPortableArchive
          $env:CCP_NEW_UI_ROOT = (Resolve-Path dist/win-cpu).Path
          $env:CCP_ENGINE_EXE = "$env:CCP_NEW_UI_ROOT/ccp-engine.exe"
          $env:CCP_LIBTORCH_ROOT = "$env:CCP_NEW_UI_ROOT/libtorch"
          python api/tests/integration_workflow.py --root $env:CCP_NEW_UI_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'workflow integration' }
          python api/tests/integration_all_methods.py --root $env:CCP_NEW_UI_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'six fit methods' }
          python api/tests/integration_video.py --root $env:CCP_NEW_UI_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'video integration' }
          python -m pip install -r notebooks/requirements-qa.txt
          if ($LASTEXITCODE -ne 0) { throw 'notebook dependencies' }
          python api/tests/execute_notebooks.py --root $env:CCP_NEW_UI_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'notebooks' }
          python scripts/verify_payload.py dist/win-cpu
          if ($LASTEXITCODE -ne 0) { throw 'payload integrity' }
      - name: Reviewable regression evidence (not a release)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-validation-${{ github.sha }}
          path: |
            app/**/TestResults/**
            dist/win-cpu/build-info.json
            dist/win-cpu/licenses/dependency-inventory.json
          if-no-files-found: warn
          retention-days: 30
