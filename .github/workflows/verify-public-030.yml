name: Verify public Studio 0.3.0 downloads
on:
  push:
    branches: [codex/verify-public-studio-030]
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {rid: win-x64, runner: windows-2025, arch: x64}
          - {rid: win-arm64, runner: windows-11-arm, arch: arm64}
          - {rid: linux-x64, runner: ubuntu-24.04, arch: x64}
          - {rid: linux-arm64, runner: ubuntu-24.04-arm, arch: arm64}
          - {rid: osx-arm64, runner: macos-15, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.10', architecture: '${{ matrix.arch }}'}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/verify_public_download.py ${{ matrix.rid }}
      - if: runner.os != 'Linux'
        run: python scripts/verify_public_download.py ${{ matrix.rid }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-sample-${{ matrix.rid }}
          path: ${{ runner.temp }}/released-studio/*/result.json
