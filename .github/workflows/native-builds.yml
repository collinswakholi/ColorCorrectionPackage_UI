name: Native release candidates and source checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  # Main commits keep separate groups: a README-only successor must not cancel
  # or replace queued native validation. PR diffs remain cumulative and supersedable.
  group: native-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: '0'
jobs:
  changes:
    name: Classify README/demo-only changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.classify.outputs.native }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12.10', architecture: x64}
      - id: classify
        run: python scripts/classify_ci_changes.py
  documentation:
    name: Documentation and examples (offline checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12.10', architecture: x64}
      - name: Pinned documentation tooling
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r scripts/requirements-ci.txt
      - run: python scripts/check_documentation.py
      - name: Documentation and classification regressions
        run: |
          python -m unittest discover -s scripts/tests -p test_ci_changes.py -v
          python -m unittest discover -s scripts/tests -p test_documentation.py -v
          python -m unittest discover -s scripts/tests -p test_workflow_contracts.py -v
          python -m unittest discover -s api/tests -p test_documented_examples.py -v
  packages:
    needs: [changes]
    if: needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, rid: win-x64, architecture: x64, rust: x86_64-pc-windows-msvc}
          - {runner: windows-11-arm, rid: win-arm64, architecture: arm64, rust: aarch64-pc-windows-msvc}
          - {runner: ubuntu-24.04, rid: linux-x64, architecture: x64, rust: x86_64-unknown-linux-gnu}
          - {runner: ubuntu-24.04-arm, rid: linux-arm64, architecture: arm64, rust: aarch64-unknown-linux-gnu}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      # Keep CI on the installed native compiler without auto-installing local lint tools.
      RUSTUP_TOOLCHAIN: 1.95.0-${{ matrix.rust }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
          architecture: ${{ matrix.architecture }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Native Rust toolchain and wheel build tooling
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"
          rustup show active-toolchain
          rustc -Vv
          python -m pip install setuptools==78.1.0 wheel==0.45.1
          python -m pip install --only-binary=:all: --require-hashes -r scripts/requirements-ci.txt
      - name: Pinned Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup_ci_windows.ps1 -Output "${{ runner.temp }}/colorcorrect-build-tools"
      - name: Ubuntu build and desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-0t64 libfontconfig1 libx11-6 libxrandr2 libxi6 libice6 libsm6 libgl1 libvulkan1 libicu74 libssl3t64 libkrb5-3 zlib1g xvfb
      - name: Native package and installed SDK smoke (GPU gate remains separate)
        shell: bash
        env:
          CCP_NOTICE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ '${{ runner.os }}' = Linux ]; then
            xvfb-run -a python scripts/native_ci_acceptance.py --rid '${{ matrix.rid }}' --install-package
          else
            python scripts/native_ci_acceptance.py --rid '${{ matrix.rid }}' --install-package
          fi
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-${{ matrix.rid }}-${{ github.sha }}
          path: |
            artifacts/native-ci/${{ matrix.rid }}/evidence/**/*.json
            artifacts/native-ci/${{ matrix.rid }}/evidence/**/*.log
            artifacts/native-ci/${{ matrix.rid }}/evidence/**/*.txt
            artifacts/native-ci/${{ matrix.rid }}/evidence/**/*.trx
            artifacts/native-ci/${{ matrix.rid }}/evidence/**/*.png
          if-no-files-found: error
      - name: Upload unsigned candidates for validation or a version-tag release
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ matrix.rid }}-${{ github.sha }}
          path: |
            artifacts/native-ci/${{ matrix.rid }}/package/*.zip
            artifacts/native-ci/${{ matrix.rid }}/package/*.tar.gz
            artifacts/native-ci/${{ matrix.rid }}/package/*.deb
            artifacts/native-ci/${{ matrix.rid }}/package/*-Setup.exe
            artifacts/native-ci/${{ matrix.rid }}/package/SHA256SUMS
            artifacts/native-ci/${{ matrix.rid }}/package/package-manifest.json
          if-no-files-found: error
  publish:
    name: Publish verified full release
    needs: [packages, macos_source, validation]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.packages.result == 'success' && needs.macos_source.result == 'success' && needs.validation.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12.10', architecture: x64}
      - name: Verify all five candidates, upload a draft, and publish full/latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py --publish --stable --include-macos-arm64 --output "$RUNNER_TEMP/release-assets"
  macos_source:
    name: Apple-silicon application and source validation
    needs: [changes]
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: 1.95.0-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12.10', architecture: arm64}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: {global-json-file: global.json}
      - name: Native source build tools
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"
          rustup show active-toolchain
          rustc -Vv
          python -m pip install setuptools==78.1.0 wheel==0.45.1
          python -m pip install --only-binary=:all: --require-hashes -r scripts/requirements-ci.txt
      - name: Build, relocate and test Apple-silicon application/API
        env:
          CCP_NOTICE_GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/native_ci_acceptance.py --rid osx-arm64 --macos-binary
      - name: Upload text evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-evidence-osx-arm64-${{ github.sha }}
          path: |
            artifacts/native-ci/osx-arm64/evidence/*.json
            artifacts/native-ci/osx-arm64/evidence/*.log
            artifacts/native-ci/osx-arm64/evidence/*.txt
            artifacts/native-ci/osx-arm64/evidence/*.trx
            artifacts/native-ci/osx-arm64/evidence/sdk-smoke/result.json
            artifacts/native-ci/osx-arm64/evidence/sdk-full-cpu-inference/result.json
            artifacts/native-ci/osx-arm64/evidence/sdk-full-cpu-inference/cpu-inference-profile*.json
            artifacts/native-ci/osx-arm64/evidence/sdk-full-auto/result.json
          if-no-files-found: error
      - name: Upload verified Apple-silicon application candidate
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-osx-arm64-${{ github.sha }}
          path: |
            artifacts/native-ci/osx-arm64/package/*.zip
            artifacts/native-ci/osx-arm64/package/*.tar.gz
            artifacts/native-ci/osx-arm64/package/SHA256SUMS
            artifacts/native-ci/osx-arm64/package/package-manifest.json
          if-no-files-found: error
  validation:
    name: Validation result
    needs: [changes, documentation, packages, macos_source]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12.10', architecture: x64}
      - name: Require all applicable validation
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/check_ci_results.py
