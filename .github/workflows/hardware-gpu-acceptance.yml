name: Hardware GPU acceptance (provisioning pending)
on:
  workflow_dispatch:
    inputs:
      enable_hardware_run:
        description: 'Run only after a native GPU runner has been provisioned and reviewed'
        type: boolean
        default: false
      rid:
        description: Native runner target
        type: choice
        options: [win-x64, win-arm64, linux-x64, linux-arm64, osx-arm64]
permissions:
  contents: read
jobs:
  pending:
    if: ${{ !inputs.enable_hardware_run || vars.CCP_GPU_RUNNER_LABEL == '' }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Hardware acceptance is pending. No GPU runner is configured or authorized by this dispatch. No support certification is produced.'
  acceptance:
    if: ${{ inputs.enable_hardware_run && vars.CCP_GPU_RUNNER_LABEL != '' }}
    runs-on: ${{ vars.CCP_GPU_RUNNER_LABEL }}
    timeout-minutes: 90
    env:
      CCP_GPU_ACCEPTANCE_ENABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
          architecture: ${{ endsWith(inputs.rid, 'arm64') && 'arm64' || 'x64' }}
      - name: Pinned build/test tooling
        run: |
          python -m pip install setuptools==78.1.0 wheel==0.45.1
          python -m pip install --only-binary=:all: --require-hashes -r scripts/requirements-ci.txt
      - name: Use explicitly provisioned native tools and GPU
        run: python scripts/native_ci_acceptance.py --rid '${{ inputs.rid }}' --mode hardware
      - name: Preserve evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gpu-evidence-${{ inputs.rid }}-${{ github.sha }}
          path: |
            artifacts/native-ci/${{ inputs.rid }}/evidence/**/*.json
            artifacts/native-ci/${{ inputs.rid }}/evidence/**/*.log
            artifacts/native-ci/${{ inputs.rid }}/evidence/**/*.txt
            artifacts/native-ci/${{ inputs.rid }}/evidence/**/*.trx
          if-no-files-found: error
