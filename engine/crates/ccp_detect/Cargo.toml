[package]
name = "ccp_detect"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Speedy Opt2 assemble, plane crop, and accelerator probe"

[features]
default = []
tch = ["dep:tch"]
ort-plane = ["dep:ort"]

[dependencies]
ccp_core = { path = "../ccp_core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
tch = { version = "0.22", optional = true }
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["load-dynamic", "cuda", "directml", "openvino", "coreml"] }

