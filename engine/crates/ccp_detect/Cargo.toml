[package]
name = "ccp_detect"
version = "0.2.2"
edition = "2021"
license = "MIT"
description = "Speedy Opt2 assemble, plane crop, and accelerator probe"

[features]
default = []
ort-plane = ["dep:ort", "dep:wgpu"]
rust-inference = ["dep:ccp_wgpu_infer", "ort-plane"]
wgpu-lut = ["dep:wgpu", "dep:bytemuck"]

[dependencies]
ccp_core = { path = "../ccp_core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["load-dynamic", "std", "api-22", "directml"] }
wgpu = { version = "=30.0.1", optional = true, default-features = false, features = ["std", "dx12", "vulkan", "metal", "wgsl"] }
bytemuck = { version = "1.25", optional = true }
rayon = "1.10"

[target.'cfg(target_os = "linux")'.dependencies]
ccp_wgpu_infer = { path = "../ccp_wgpu_infer", optional = true }

[dev-dependencies]
ndarray = "0.16"
rayon = "1.10"

[[example]]
name = "gpu_inference_check"
required-features = ["ort-plane"]

[[example]]
name = "decode_inference"
required-features = ["ort-plane"]
