[package]
name = "ccp_bridge"
version = "0.2.1"
edition = "2021"
description = "NDJSON serve binary (ccp-engine) for ColorCorrect Studio"
license = "MIT"

[lib]
name = "ccp_bridge"
path = "src/lib.rs"

[[bin]]
name = "ccp-engine"
path = "src/main.rs"

[features]
default = ["ort-plane", "wgpu-lut", "rust-inference"]
rust-inference = ["ccp_detect/rust-inference"]
wgpu-lut = ["ccp_detect/wgpu-lut"]
ort-plane = ["ccp_detect/ort-plane"]
[dependencies]
ccp_core = { path = "../ccp_core" }
ccp_detect = { path = "../ccp_detect" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
jpeg-encoder = "0.7.1"
ndarray = { version = "0.16", features = ["rayon"] }
rayon = "1.10"
